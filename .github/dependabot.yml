version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Non-major bumps land as a single weekly PR; majors get their own.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # steiger has no TypeScript 7 support yet — skip TS 7 bumps for now
      - dependency-name: typescript
        versions: ['>=7']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
